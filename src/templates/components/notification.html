<div class="notification-overlay" id="unrecognizedNotification">
    <div class="notification-content">
        <div class="notification-icon">
            <i class="fas fa-question-circle"></i>
        </div>
        <div class="notification-text">
            <h4>Цифра не распознана</h4>
            <p>Нейросеть определила, что нарисованная цифра не соответствует ни одной из цифр 0-9.</p>
            <p>Попробуйте нарисовать цифру более четко и в центре области.</p>
        </div>
        <button class="notification-close" id="notificationClose">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>
